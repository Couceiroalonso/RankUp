<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#07070F"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="apple-mobile-web-app-title" content="RankUp"/>
    <meta name="description" content="Tu entrenamiento personal gamificado"/>
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json"/>
    <!-- Apple touch icon -->
    <link rel="apple-touch-icon" href="/icons/icon-180.png"/>
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png"/>
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-16.png"/>
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet"/>
    <title>RankUp · Fitness</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body {
        height: 100%;
        background: #07070F;
        color: #FFF;
        font-family: 'Rajdhani', sans-serif;
        -webkit-tap-highlight-color: transparent;
        /* "contain" evita el rebote/pull-to-refresh sin bloquear el scroll
           normal — "none" lo bloqueaba del todo en algunos móviles Android */
        overscroll-behavior-y: contain;
      }
      #root {
        min-height: 100%;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      /* Hide scrollbar but keep scroll */
      ::-webkit-scrollbar { width: 0; background: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
    <script>
      // Register Service Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(r => {
              console.log('SW registered:', r.scope);

              // Si ya hay un Service Worker nuevo esperando (por ejemplo,
              // porque esta pestaña llevaba abierta desde antes del último
              // despliegue), lo activamos ya mismo en vez de esperar a que
              // el usuario cierre y reabra la app.
              if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' });

              // Si aparece un Service Worker nuevo mientras la pestaña está
              // abierta, en cuanto termine de instalarse lo dejamos tomar
              // el control (skipWaiting ya lo hace internamente).
              r.addEventListener('updatefound', () => {
                const newSW = r.installing;
                if (!newSW) return;
                newSW.addEventListener('statechange', () => {
                  if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                    newSW.postMessage({ type: 'SKIP_WAITING' });
                  }
                });
              });
            })
            .catch(e => console.log('SW error:', e));

          // En cuanto el Service Worker nuevo toma el control de la
          // página, recargamos UNA sola vez para que la app cargue ya con
          // el JS/CSS más reciente, en vez de quedarse pillada en el
          // bundle viejo hasta el próximo cierre manual.
          let reloaded = false;
          navigator.serviceWorker.addEventListener('controllerchange', () => {
            if (reloaded) return;
            reloaded = true;
            window.location.reload();
          });
        });
      }
    </script>
  </body>
</html>
